<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Kaushik Kumar Mohanta — Web Developer. Night sky with moon, red torii gate and drifting embers.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.6" stop-color="#0e1428"/>
      <stop offset="1" stop-color="#3a0d1f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8f1ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#4cc9f0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d18"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <path id="petal" d="M0 -5 L3 0 L0 5 L-3 0 Z"/>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="90" cy="48" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="95" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="38" r="1.4"><animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="80" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="30" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="70" r="1"><animate attributeName="opacity" values=".4;1;.4" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="28" r="1.3"><animate attributeName="opacity" values="1;.3;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="60" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="105" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="150" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1070" cy="170" r="1"><animate attributeName="opacity" values="1;.3;1" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="1020" cy="110" r="150" fill="url(#moonGlow)"/>
  <circle cx="1020" cy="110" r="52" fill="#e8f1ff"/>
  <circle cx="1002" cy="96" r="8" fill="#b9c9e6" opacity=".7"/>
  <circle cx="1040" cy="128" r="5" fill="#b9c9e6" opacity=".7"/>
  <circle cx="1032" cy="86" r="3.5" fill="#b9c9e6" opacity=".6"/>

  <!-- hills -->
  <path d="M0 260 Q 200 215 420 255 T 820 250 T 1200 240 V320 H0 Z" fill="url(#hill)"/>

  <!-- torii gate -->
  <g fill="#e63946" transform="translate(1100 196)">
    <path d="M-62 0 Q 0 -14 62 0 L 66 -10 Q 0 -28 -66 -10 Z"/>
    <rect x="-52" y="8" width="104" height="8" rx="1"/>
    <rect x="-44" y="16" width="10" height="64"/>
    <rect x="34" y="16" width="10" height="64"/>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="start">
    <text x="70" y="128" font-size="50" font-weight="700" fill="#f1f6ff" letter-spacing="1">Kaushik Kumar Mohanta</text>
    <text x="72" y="170" font-size="24" fill="#4cc9f0" letter-spacing="3">DEVELOPER</text>
    <text x="72" y="206" font-size="18" fill="#9fb3d9" letter-spacing="2">turning ideas into clean, working code</text>
  </g>

  <!-- rising embers -->
  <g fill="#ff6b35" opacity=".95">
    <use href="#petal" x="0" y="0">
      <animateMotion dur="9s" repeatCount="indefinite" path="M170 340 C 90 160, 160 80, 120 -20"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" x="0" y="0" fill="#ffb703">
      <animateMotion dur="11s" begin="-3s" repeatCount="indefinite" path="M350 340 C 430 170, 330 90, 380 -20"/>
    </use>
    <use href="#petal" x="0" y="0">
      <animateMotion dur="8s" begin="-5s" repeatCount="indefinite" path="M640 340 C 560 180, 650 100, 600 -20"/>
    </use>
    <use href="#petal" x="0" y="0" fill="#e63946">
      <animateMotion dur="12s" begin="-7s" repeatCount="indefinite" path="M760 340 C 830 150, 740 70, 780 -20"/>
    </use>
    <use href="#petal" x="0" y="0" fill="#ffb703">
      <animateMotion dur="10s" begin="-1s" repeatCount="indefinite" path="M930 340 C 870 170, 950 90, 900 -20"/>
    </use>
    <use href="#petal" x="0" y="0">
      <animateMotion dur="13s" begin="-9s" repeatCount="indefinite" path="M280 340 C 200 190, 290 70, 240 -20"/>
    </use>
    <use href="#petal" x="0" y="0" fill="#e63946">
      <animateMotion dur="9.5s" begin="-4s" repeatCount="indefinite" path="M1100 340 C 1160 180, 1080 100, 1120 -20"/>
    </use>
  </g>
</svg>
