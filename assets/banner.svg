<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Kaushik Kumar Mohanta — Web Developer. Night sky with moon, torii gate and falling sakura petals.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14122b"/>
      <stop offset="0.6" stop-color="#2b1d4a"/>
      <stop offset="1" stop-color="#5b2f5e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9f2" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffc2d9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffc2d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1236"/>
      <stop offset="1" stop-color="#0d0920"/>
    </linearGradient>
    <path id="petal" d="M0 0 C 5 -5, 11 -2, 9 4 C 7 9, 1 8, 0 0 Z"/>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="90" cy="48" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="95" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="38" r="1.4"><animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="80" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="30" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="70" r="1"><animate attributeName="opacity" values=".4;1;.4" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="28" r="1.3"><animate attributeName="opacity" values="1;.3;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="60" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="105" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="150" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1070" cy="170" r="1"><animate attributeName="opacity" values="1;.3;1" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="1020" cy="110" r="150" fill="url(#moonGlow)"/>
  <circle cx="1020" cy="110" r="52" fill="#fff0f6"/>
  <circle cx="1002" cy="96" r="8" fill="#f3d3e2" opacity=".7"/>
  <circle cx="1040" cy="128" r="5" fill="#f3d3e2" opacity=".7"/>
  <circle cx="1032" cy="86" r="3.5" fill="#f3d3e2" opacity=".6"/>

  <!-- hills -->
  <path d="M0 260 Q 200 215 420 255 T 820 250 T 1200 240 V320 H0 Z" fill="url(#hill)"/>

  <!-- torii gate -->
  <g fill="#e8456b" transform="translate(1100 196)">
    <path d="M-62 0 Q 0 -14 62 0 L 66 -10 Q 0 -28 -66 -10 Z"/>
    <rect x="-52" y="8" width="104" height="8" rx="1"/>
    <rect x="-44" y="16" width="10" height="64"/>
    <rect x="34" y="16" width="10" height="64"/>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="start">
    <text x="70" y="128" font-size="50" font-weight="700" fill="#fff5f9" letter-spacing="1">Kaushik Kumar Mohanta</text>
    <text x="72" y="170" font-size="24" fill="#ffb3cc" letter-spacing="3">WEB DEVELOPER  ·  DJANGO  ·  C++</text>
    <text x="72" y="206" font-size="18" fill="#cdb8e6" letter-spacing="2">building one quest at a time</text>
  </g>

  <!-- falling sakura petals -->
  <g fill="#ffb7d1" opacity=".9">
    <use href="#petal" x="0" y="0">
      <animateMotion dur="9s" repeatCount="indefinite" path="M120 -20 C 160 80, 90 160, 170 340"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" x="0" y="0" fill="#ffd0e1">
      <animateMotion dur="11s" begin="-3s" repeatCount="indefinite" path="M380 -20 C 330 90, 430 170, 350 340"/>
    </use>
    <use href="#petal" x="0" y="0">
      <animateMotion dur="8s" begin="-5s" repeatCount="indefinite" path="M600 -20 C 650 100, 560 180, 640 340"/>
    </use>
    <use href="#petal" x="0" y="0" fill="#ff9ec0">
      <animateMotion dur="12s" begin="-7s" repeatCount="indefinite" path="M780 -20 C 740 70, 830 150, 760 340"/>
    </use>
    <use href="#petal" x="0" y="0" fill="#ffd0e1">
      <animateMotion dur="10s" begin="-1s" repeatCount="indefinite" path="M900 -20 C 950 90, 870 170, 930 340"/>
    </use>
    <use href="#petal" x="0" y="0">
      <animateMotion dur="13s" begin="-9s" repeatCount="indefinite" path="M240 -20 C 290 70, 200 190, 280 340"/>
    </use>
    <use href="#petal" x="0" y="0" fill="#ff9ec0">
      <animateMotion dur="9.5s" begin="-4s" repeatCount="indefinite" path="M1120 -20 C 1080 100, 1160 180, 1100 340"/>
    </use>
  </g>
</svg>
