<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Status window: Kaushik, Web Developer. Main quest: Django web apps. Side quest: data structures in C++.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1533"/>
      <stop offset="1" stop-color="#2a1b45"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7aa8"/>
      <stop offset="1" stop-color="#b58cff"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="794" height="254" rx="14" fill="url(#bg)" stroke="#ff9ec0" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;.4;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="12" y="12" width="776" height="236" rx="9" fill="none" stroke="#6d5a9e" stroke-width="1" stroke-dasharray="4 4"/>
  <g font-family="'Courier New',Consolas,monospace" font-size="17">
    <text x="36" y="48" fill="#ffb3cc" font-size="20" font-weight="700">[ STATUS WINDOW ]</text>
    <text x="36" y="84"  fill="#cdb8e6">NAME</text>      <text x="190" y="84"  fill="#fff5f9">Kaushik Kumar Mohanta</text>
    <text x="36" y="112" fill="#cdb8e6">CLASS</text>     <text x="190" y="112" fill="#fff5f9">Web Developer</text>
    <text x="36" y="140" fill="#cdb8e6">MAIN QUEST</text><text x="190" y="140" fill="#fff5f9">Django web apps, end to end</text>
    <text x="36" y="168" fill="#cdb8e6">SIDE QUEST</text><text x="190" y="168" fill="#fff5f9">DSA &amp; problem-solving in C++</text>
    <text x="36" y="196" fill="#cdb8e6">EQUIPMENT</text> <text x="190" y="196" fill="#fff5f9">VS Code · Git · GitHub · Linux</text>
    <text x="36" y="232" fill="#cdb8e6">EXP</text>
    <rect x="190" y="218" width="420" height="14" rx="7" fill="#0f0b22" stroke="#6d5a9e"/>
    <rect x="190" y="218" width="0" height="14" rx="7" fill="url(#bar)">
      <animate attributeName="width" values="0;300;300" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="626" y="231" fill="#ffb3cc">levelling up<tspan>
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>_</tspan></text>
  </g>
</svg>
