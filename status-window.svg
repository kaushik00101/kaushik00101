<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Status window: Kaushik, Web Developer. Main quest: Django web apps. Side quest: data structures in C++." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#161d33"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="794" height="254" rx="14" fill="url(#bg)" stroke="#4cc9f0" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;.4;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="12" y="12" width="776" height="236" rx="9" fill="none" stroke="#2f3b66" stroke-width="1" stroke-dasharray="4 4"/>
  <g font-family="'Courier New',Consolas,monospace" font-size="17">
    <text x="36" y="48" fill="#4cc9f0" font-size="20" font-weight="700">[ STATUS WINDOW ]</text>
    <text x="36" y="84"  fill="#9fb3d9">NAME</text>      <text x="190" y="84"  fill="#f1f6ff">Kaushik Kumar Mohanta</text>
    <text x="36" y="112" fill="#9fb3d9">CLASS</text>     <text x="190" y="112" fill="#f1f6ff">Web Developer</text>
    <text x="36" y="140" fill="#9fb3d9">MAIN QUEST</text><text x="190" y="140" fill="#f1f6ff">Django web apps, end to end</text>
    <text x="36" y="168" fill="#9fb3d9">SIDE QUEST</text><text x="190" y="168" fill="#f1f6ff">DSA &amp; problem-solving in C++</text>
    <text x="36" y="196" fill="#9fb3d9">EQUIPMENT</text> <text x="190" y="196" fill="#f1f6ff">VS Code · Git · GitHub · Linux</text>
    <text x="36" y="232" fill="#9fb3d9">EXP</text>
    <rect x="190" y="218" width="420" height="14" rx="7" fill="#070a14" stroke="#2f3b66"/>
    <rect x="190" y="218" width="0" height="14" rx="7" fill="url(#bar)">
      <animate attributeName="width" values="0;300;300" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="626" y="231" fill="#4cc9f0">levelling up<tspan>
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>_</tspan></text>
  </g>
</svg>
