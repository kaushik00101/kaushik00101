name: Pac-Man contribution graph

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # Actions tab -> Run workflow

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Other games you can add: breakout, galaga, puzzle-bobble, bomberman, minesweeper
          games: "pacman"
          hide_month_labels: "false"

      # Writes dist/pacman-contribution-graph.svg (light) and
      # dist/pacman-contribution-graph-dark.svg (dark) to the `output` branch
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
